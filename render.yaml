# Render Blueprint: un servicio Node que sirve la app (dist/) y la API del resumen en Neon (server/index.js).
# Los archivos se siguen leyendo en el navegador; al servidor solo llega el resumen día × modelo × estación.
services:
  - type: web
    name: yield-control
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # cadena de conexión de Neon (Dashboard → Connection string). Se escribe en Render, nunca en el repositorio.
      - key: DATABASE_URL
        sync: false
      # firma las sesiones; Render la genera y no se ve en el repositorio
      - key: SESSION_SECRET
        generateValue: true
      # primer administrador (se crea al arrancar si no existe); las demás cuentas se piden desde el login
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
